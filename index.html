<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f6f8">
  <title>今日日期计算结果</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #20242b;
      --muted: #707782;
      --line: #e4e7ec;
      --surface: #ffffff;
      --page: #f5f6f8;
      --accent: #315efb;
      --soft: #edf1ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px;
      display: grid;
      place-items: center;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    main { width: min(100%, 440px); }
    .eyebrow {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
    }
    h1 {
      margin: 0;
      font-size: clamp(25px, 6vw, 32px);
      letter-spacing: -.04em;
    }
    .intro {
      margin: 9px 0 22px;
      color: var(--muted);
      line-height: 1.65;
      font-size: 14px;
    }
    .panel {
      padding: 24px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--surface);
      box-shadow: 0 12px 35px rgba(25, 35, 55, .06);
    }
    .date-label, .result-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
    }
    .date {
      margin-top: 7px;
      font-size: clamp(22px, 6vw, 29px);
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      letter-spacing: -.03em;
    }
    .result {
      margin-top: 22px;
      padding: 22px 16px;
      border-radius: 14px;
      background: var(--soft);
      text-align: center;
    }
    .result-label { margin: 0; color: #52618c; }
    output {
      display: block;
      margin: 8px 0 5px;
      color: #2448d8;
      font-size: 64px;
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: .14em;
      font-variant-numeric: tabular-nums;
    }
    .detail {
      color: #64708e;
      font-size: 12px;
      line-height: 1.6;
    }
    .formula {
      margin: 17px 2px 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
      text-align: center;
    }
    @media (max-width: 390px) {
      .panel { padding: 19px; }
      output { font-size: 58px; }
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">DATE NUMBER</p>
    <h1>今日日期计算结果</h1>
    <p class="intro">按照北京时间（UTC+8）计算今日日期及对应的两位数字。</p>

    <section class="panel" aria-live="polite">
      <div class="date-label">北京时间 · UTC+8</div>
      <div class="date" id="todayDate">正在读取日期…</div>

      <div class="result">
        <p class="result-label">今日计算结果 · 后两位</p>
        <output id="result">--</output>
        <div class="detail" id="calculation"></div>
      </div>
    </section>

    <p class="formula">固定算法： (日期 × 7 + 月份 × 11 + 62) mod 100</p>
  </main>

  <script>
    function getChinaDateParts() {
        const parts = new Intl.DateTimeFormat('en-US', {
            timeZone: 'Asia/Shanghai',
            year: 'numeric',
            month: 'numeric',
            day: 'numeric'
        }).formatToParts(new Date());
        const values = {};
        for (const part of parts) {
            if (part.type === 'year' || part.type === 'month' || part.type === 'day') {
                values[part.type] = Number(part.value);
            }
        }
        return values;
    }
    function updateTodayResult() {
      const today = getChinaDateParts();
      const year = today.year;
      const month = today.month;
      const day = today.day;

      const monthText = String(month).padStart(2, '0');
      const dayText = String(day).padStart(2, '0');

      const raw = day * 7 + month * 11 + 62;
      const suffix = String(((raw % 100) + 100) % 100).padStart(2, '0');

      document.getElementById('todayDate').textContent =
        `${year}年${monthText}月${dayText}日`;
      document.getElementById('result').textContent = suffix;
      document.getElementById('calculation').textContent =
        `${day} × 7 + ${month} × 11 + 62 = ${raw}，取模 100`;
    }

    updateTodayResult();
    // 页面持续打开时，跨越北京时间午夜后也会自动更新。
    setInterval(updateTodayResult, 30000);
  </script>
</body>
</html>
